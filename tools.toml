# Explicitly invoked by just install-tools; Linux x86_64 is the initial target.
[[tools]]
name = "ast-outline"
command = "ast-outline"
minimum_version = "1.9.0"
version_args = ["--version"]
method = "uv"
package = "ast-outline==1.9.0"
constraints = "constraints/ast-outline.txt"
exclude_newer = "2026-10-21T00:00:00Z"

[[tools]]
name = "ast-grep"
command = "ast-grep"
minimum_version = "0.50.0"
