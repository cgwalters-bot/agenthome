[package]
name = "agenthome"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
ryu-js = "1"

[dev-dependencies]
tempfile = "3"
