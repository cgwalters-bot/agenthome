name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    # The runner image's stable Rust toolchain, with rustfmt and clippy;
    # Cargo.toml's rust-version says what the code needs.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - run: just check
      - run: just check-install
